<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayanApp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif}
body{background:#111b21;color:#e9edef;height:100vh;display:flex;flex-direction:column}
.top{background:#202c33;padding:15px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:800} .logo b{color:#25d366}
.main{flex:1;overflow-y:auto;padding:20px;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}
.msg{max-width:75%;padding:8px 12px;border-radius:8px;margin-bottom:10px;background:#202c33;font-size:14px;line-height:1.4}
.msg.me{background:#005c4b;margin-left:auto}
.msg .name{font-size:11px;color:#25d366;font-weight:700;margin-bottom:2px}
.bottom{background:#202c33;padding:10px;display:flex;gap:10px;align-items:center}
.bottom input{flex:1;padding:12px 15px;border-radius:25px;border:none;outline:none;background:#2a3942;color:white}
.bottom button{background:#25d366;border:none;width:45px;height:45px;border-radius:50%;cursor:pointer;color:white;font-size:18px}
#login{position:fixed;inset:0;background:#111b21;display:flex;align-items:center;justify-content:center;z-index:10}
.login-box{background:#202c33;padding:30px;border-radius:12px;width:90%;max-width:320px;text-align:center}
.login-box input{width:100%;padding:12px;margin:15px 0;border-radius:8px;border:none;outline:none}
.login-box button{width:100%;padding:12px;background:#25d366;border:none;border-radius:8px;color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="login">
<div class="login-box">
<div class="logo"><b>Layan</b>App</div>
<p style="margin-top:10px;font-size:13px;opacity:.7">Enter your name to start chat</p>
<input id="username" placeholder="Your name">
<button onclick="joinChat()">Join Chat</button>
</div>
</div>

<div class="top"><div class="logo"><b>Layan</b>App</div><div id="userDisplay" style="font-size:12px;opacity:.8"></div></div>
<div class="main" id="chatBox"></div>
<div class="bottom">
<input id="messageInput" placeholder="Type a message" onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDemoKeyForLayanApp123",
  authDomain: "layanapp-demo.firebaseapp.com",
  databaseURL: "https://layanapp-demo-default-rtdb.firebaseio.com",
  projectId: "layanapp-demo",
  storageBucket: "layanapp-demo.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef"
};

let db, chatRef;
let currentUser = "";

try {
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  chatRef = ref(db, "layanapp_messages");
} catch(e) {
  console.log("Firebase demo mode - using local");
}

window.joinChat = () => {
  const name = document.getElementById('username').value.trim();
  if(!name) return alert("Enter name");
  currentUser = name;
  document.getElementById('login').style.display = 'none';
  document.getElementById('userDisplay').innerText = name;
  loadMessages();
}

function loadMessages() {
  if(!chatRef) {
    const localMsgs = JSON.parse(localStorage.getItem('layanapp') || '[]');
    localMsgs.forEach(addMsgToUI);
    return;
  }
  onChildAdded(chatRef, (snap) => {
    addMsgToUI(snap.val());
  });
}

function addMsgToUI(data) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg' + (data.user === currentUser ? ' me' : '');
  div.innerHTML = `<div class="name">${data.user}</div>${data.text}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

window.sendMsg = () => {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if(!text) return;
  const data = { user: currentUser, text: text, time: Date.now() };
  
  if(chatRef) {
    push(chatRef, data);
  } else {
    let arr = JSON.parse(localStorage.getItem('layanapp') || '[]');
    arr.push(data);
    localStorage.setItem('layanapp', JSON.stringify(arr));
    addMsgToUI(data);
  }
  input.value = '';
}
</script>
</body>
</html>
