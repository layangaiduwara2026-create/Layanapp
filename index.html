<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayanApp - Fast Chat</title>
<style>
body{margin:0;font-family:sans-serif;background:#111b21;color:white}
.header{background:#202c33;padding:15px;font-size:20px;font-weight:bold;display:flex;justify-content:space-between}
.header span{color:#25d366}
.chat{padding:15px;height:75vh;overflow-y:auto}
.msg{background:#202c33;padding:10px 15px;border-radius:8px;margin:8px 0;max-width:80%}
.me{background:#005c4b;margin-left:auto}
.input-area{position:fixed;bottom:0;width:100%;background:#202c33;padding:10px;display:flex;gap:10px}
.input-area input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
.input-area button{background:#25d366;border:none;padding:12px 18px;border-radius:50%;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="header"><div><span>Layan</span>App</div><div style="font-size:12px">Online</div></div>
<div class="chat" id="chat">
<div class="msg">Welcome to LayanApp! 👋</div>
<div class="msg me">මේක වෙනමම Chat App එකක්</div>
<div class="msg">WH එකට සම්බන්ධ නෑ, 100% වෙනම</div>
</div>
<div class="input-area">
<input id="txt" placeholder="Type a message...">
<button onclick="send()">></button>
</div>
<script>
function send(){
let t=document.getElementById('txt');
if(t.value=='')return;
let d=document.createElement('div');
d.className='msg me';d.innerText=t.value;
document.getElementById('chat').appendChild(d);
t.value='';
setTimeout(()=>{let r=document.createElement('div');r.className='msg';r.innerText='Message received on LayanApp ✅';document.getElementById('chat').appendChild(r)},600);
}
</script>
</body>
</html>
