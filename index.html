<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LayanApp - Private</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0b1014;height:100vh;color:#e9edef;overflow:hidden}
.wa-header{background:#0b1014;padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.wa-header h1{font-size:23px;font-weight:700}
.search-bar{padding:8px 16px}.search-inner{background:#1f2c34;border-radius:22px;padding:10px 16px;display:flex;gap:14px;color:#8696a0}
.search-inner input{background:transparent;border:none;outline:none;color:#e9edef;width:100%;font-size:15px}
.filters{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}.chip{padding:6px 12px;border-radius:18px;background:#1f2c34;color:#8696a0;font-size:13px;border:none}.chip.active{background:#0a332c;color:#53bdeb;font-weight:600}
.chat-list{flex:1;overflow-y:auto}.chat-item{display:flex;gap:12px;padding:12px 16px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.fab{position:fixed;right:16px;bottom:76px;width:56px;height:56px;background:#25d366;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#0b1014;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0b1014;border-top:1px solid #1f2c34;display:flex;justify-content:space-around;padding:6px 0 10px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8696a0;font-size:11px}.nav-item.active{color:#e9edef}
.chat-screen{position:fixed;inset:0;background:#0b141a;z-index:100;display:none;flex-direction:column}.chat-screen.active{display:flex}
.chat-screen .c-header{background:#202c33;padding:10px 12px;display:flex;align-items:center;gap:10px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}.msg{max-width:78%;padding:8px 10px;border-radius:8px;margin-bottom:8px}
.msg.other{background:#202c33;align-self:flex-start}.msg.me{background:#005c4b;align-self:flex-end}
.inputArea{background:#202c33;padding:6px 10px;display:flex;gap:8px}.inputArea input{flex:1;padding:12px 14px;border-radius:24px;border:none;background:#2a3942;color:#fff;outline:none}.inputArea button{background:#00a884;border:none;width:44px;height:44px;border-radius:50%;color:#fff;font-size:20px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end}.sheet.active{display:flex}.sheet-box{background:#1f2c34;width:100%;border-radius:20px 20px 0 0;padding:20px}
.sheet-box input{width:100%;padding:12px;border-radius:8px;border:none;background:#2a3942;color:#fff;margin-bottom:10px}.sheet-box button{width:100%;padding:12px;background:#00a884;color:#fff;border:none;border-radius:10px;font-weight:bold;margin-top:6px}
.code{background:#0b141a;border:1px dashed #25d366;padding:10px;border-radius:8px;color:#25d366;word-break:break-all;margin:10px 0;font-size:13px}
</style>
</head>
<body>
<div class="wa-header"><h1>WhatsApp</h1><div>📷 ⋮</div></div>
<div class="search-bar"><div class="search-inner">🔍 <input id="search" placeholder="Ask Meta AI or Search"></div></div>
<div class="filters"><button class="chip active">All</button><button class="chip">Unread</button><button class="chip">Favourites</button><button class="chip">Groups</button><button class="chip">+</button></div>
<div class="chat-list" id="chatList"></div>
<div class="fab" id="fab">+</div>
<div class="bottom-nav"><div class="nav-item active">💬 Chats</div><div class="nav-item">◉ Updates</div><div class="nav-item">👥 Communities</div><div class="nav-item">📞 Calls</div></div>
<div class="chat-screen" id="chatScreen"><div class="c-header"><button id="backBtn">←</button><div id="cAvatar" class="avatar"></div><div style="flex:1"><div id="cName"></div><div style="font-size:12px;color:#8696a0">🔒 Private - දෙන්නට විතරයි</div></div></div><div style="background:#0a332c;color:#25d366;font-size:11px;padding:4px 8px;text-align:center">🔒 A ගෙන් B ට විතරයි, B ගෙන් A ට විතරයි</div><div class="msgs" id="msgs"></div><div class="inputArea"><input id="msgInput" placeholder="Message"><button id="sendBtn">➤</button></div></div>
<div class="sheet" id="sheet"><div class="sheet-box"><h3>🔒 Private Chat</h3><input id="myName" placeholder="ඔයාගේ නම"><input id="contactName" placeholder="යාලුවගේ නම"><button id="createPrivate">➕ අලුත් Private Link හදන්න</button><div id="codeArea" style="display:none"><div class="code" id="codeText"></div><button id="copyBtn" style="background:#2a3942">Copy Link</button><button id="openChatBtn">Chat එකට යන්න</button></div><hr style="margin:16px 0;border-color:#2a3942"><input id="joinCode" placeholder="යාලුවා දුන්න Link එක Paste කරන්න"><button id="joinBtn" style="background:#2a3942">🔗 Join Private Chat</button><button id="closeSheet" style="background:transparent;border:1px solid #2a3942">Close</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  databaseURL: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};
let db=null; if(firebaseConfig.apiKey!=="PASTE_HERE"){const app=initializeApp(firebaseConfig);db=getDatabase(app);}
let myName=localStorage.getItem('layan_name')||""; let currentRoom=null; let rooms=JSON.parse(localStorage.getItem('layan_rooms')||"[]");
const colors=["#1f8ef1","#00a884","#ff8f00","#7f66ff","#e542a3"]; function getColor(s){let h=0;for(let c of s)h+=c.charCodeAt(0);return colors[h%colors.length]}
function renderList(){const list=document.getElementById('chatList');list.innerHTML=""; if(rooms.length===0){const d=document.createElement('div');d.style="padding:30px;text-align:center;color:#8696a0;font-size:14px";d.innerHTML="තවම Private Chat නෑ<br>පහල + ඔබලා අලුත් එකක් හදන්න<br><br>🔒 A ගෙන් B ට විතරයි";list.appendChild(d);return;} rooms.forEach(r=>{const div=document.createElement('div');div.className='chat-item';div.style="display:flex;gap:12px;padding:12px 16px";const col=getColor(r.id);div.innerHTML=`<div class="avatar" style="background:${col}">${r.name[0].toUpperCase()}</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><div style="font-weight:500">${r.name}</div><div style="font-size:12px;color:#8696a0">${r.lastTime||''}</div></div><div style="font-size:14px;color:#8696a0">🔒 ${r.lastMsg||'Tap to chat'}</div></div>`;div.onclick=()=>openRoom(r.id,r.name);list.appendChild(div);});}
renderList();
function genId(){return Math.random().toString(36).substring(2,8).toUpperCase()+"-"+Date.now().toString(36).toUpperCase()}
document.getElementById('fab').onclick=()=>document.getElementById('sheet').classList.add('active');
document.getElementById('closeSheet').onclick=()=>document.getElementById('sheet').classList.remove('active');
document.getElementById('createPrivate').onclick=async()=>{const m=document.getElementById('myName').value.trim();const c=document.getElementById('contactName').value.trim();if(!m||!c)return alert("නම් දෙකම දාන්න");if(!db)return alert("Firebase Config එක දාන්න");myName=m;localStorage.setItem('layan_name',m);const id=genId();rooms.unshift({id:id,name:c,lastMsg:"Private link හැදුවා",lastTime:"now"});localStorage.setItem('layan_rooms',JSON.stringify(rooms));await set(ref(db,'private_meta/'+id),{createdBy:myName,with:c});const link=location.origin+location.pathname+"?room="+id;document.getElementById('codeArea').style.display='block';document.getElementById('codeText').innerText=link;document.getElementById('copyBtn').onclick=()=>{navigator.clipboard.writeText(link);alert("Copied!")};document.getElementById('openChatBtn').onclick=()=>openRoom(id,c);renderList();};
document.getElementById('joinBtn').onclick=()=>{let codeRaw=document.getElementById('joinCode').value.trim();let m=document.getElementById('myName').value.trim();if(!codeRaw||!m)return alert("Code එකයි නමයි දාන්න");let id=codeRaw;if(codeRaw.includes('?room=')){try{id=new URL(codeRaw).searchParams.get('room');}catch{const match=codeRaw.match(/room=([A-Z0-9\-]+)/i);if(match)id=match[1];}}id=id.toUpperCase().trim();myName=m;localStorage.setItem('layan_name',m);if(!rooms.find(r=>r.id===id)){rooms.unshift({id:id,name:"Private Friend",lastMsg:"Joined"});localStorage.setItem('layan_rooms',JSON.stringify(rooms));}document.getElementById('sheet').classList.remove('active');openRoom(id,"Private Friend");};
function openRoom(id,name){currentRoom=id;document.getElementById('chatScreen').classList.add('active');document.getElementById('cName').innerText=name;document.getElementById('cAvatar').innerText=name[0].toUpperCase();document.getElementById('cAvatar').style.background=getColor(id);const msgs=document.getElementById('msgs');msgs.innerHTML="";const r=ref(db,'private_chats/'+id);onChildAdded(r,(snap)=>{const d=snap.val();const isMe=d.name===myName;const el=document.createElement('div');el.className='msg '+(isMe?'me':'other');const tm=d.time?new Date(d.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';el.innerHTML=`<div>${d.text}</div><div style="font-size:10px;color:#8696a0;text-align:right">${tm} ✓✓</div>`;msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight;});}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
document.getElementById('backBtn').onclick=()=>{document.getElementById('chatScreen').classList.remove('active');currentRoom=null;};
function send(){const inp=document.getElementById('msgInput');const txt=inp.value.trim();if(!txt||!currentRoom||!db)return;push(ref(db,'private_chats/'+currentRoom),{name:myName,text:txt,time:Date.now()});inp.value='';}
document.getElementById('sendBtn').onclick=send;document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
(function(){const p=new URLSearchParams(location.search);const r=p.get('room');if(r){document.getElementById('sheet').classList.add('active');document.getElementById('joinCode').value=r;}})();
</script>
</body>
</html>
